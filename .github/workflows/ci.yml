name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go — lint, test, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true

      - name: go vet
        run: go vet ./cmd/... ./internal/... ./pkg/... ./tests/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: `latest` drifted to a release whose goconst behavior
          # changed, silently unblocking then re-blocking every PR.
          # Bump deliberately, verify locally, then commit the change.
          version: v2.12.2
          args: --timeout=5m ./cmd/... ./internal/... ./pkg/...

      - name: gocyclo (complexity gate)
        run: |
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          # Skip test files: table-driven tests legitimately exceed 10
          # from many `if got != want` assertions.
          gocyclo -over 10 -ignore '_test\.go$' ./cmd ./internal ./pkg | tee /tmp/cyclo.txt
          test ! -s /tmp/cyclo.txt

      - name: Test with race detector
        run: go test -race -short -coverprofile=coverage.out ./cmd/... ./internal/... ./pkg/...

      - name: Coverage gate
        run: |
          if go tool cover -func=coverage.out 2>/dev/null | grep -q '^total:'; then
            # Floor reflects actual CI coverage (45.6% as of 2026-08-28,
            # including packages with no tests in the denominator). Target
            # is 70% per CLAUDE.md §9.4 — tracked in LLMS-073.
            go tool cover -func=coverage.out | awk '/total:/ {print; if ($3+0 < 45) {print "Coverage below 45% floor"; exit 1}}'
          else
            echo "No coverage data yet (scaffold phase). Gate skipped until first test lands."
          fi

  web:
    name: Web — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --if-present
      - run: npm run build

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: true
      - name: Run integration tests
        run: go test -race -run TestIntegration ./tests/integration/...

  changelog:
    name: Changelog updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      BASE_REF: ${{ github.base_ref }}
      PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify CHANGELOG.md changed (or PR labeled no-changelog)
        run: |
          if [[ ",${PR_LABELS}," == *",no-changelog,"* ]]; then
            echo "PR labeled no-changelog, skipping."
            exit 0
          fi
          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md updated."
          else
            echo "CHANGELOG.md not updated. Add an entry under ## [Unreleased] or label the PR 'no-changelog'."
            exit 1
          fi
