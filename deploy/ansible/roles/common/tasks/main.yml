---
- name: update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: install base packages
  apt:
    name:
      - curl
      - git
      - unzip
      - htop
      - ca-certificates
      - gnupg
    state: present

# Firewall management is opt-in: the shared host (debian@15.235.186.156) hosts
# other production services and must NOT have ufw force-enabled here.
# Set manage_firewall: true only on dedicated single-purpose hosts.
- name: allow SSH through ufw
  ufw:
    rule: allow
    port: "22"
    proto: tcp
  when: manage_firewall | default(false)

- name: enable ufw
  ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: manage_firewall | default(false)
