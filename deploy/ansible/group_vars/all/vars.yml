# Shared variables for all hosts.
# Secrets (API keys, INGEST_SECRET) go in group_vars/all/vault.yml (ansible-vault encrypted).
#
# NOTE (2026-08-28): the platform main server moved off AWS to the operator's
# OVH host (15.235.186.156, Singapore). The only remaining AWS resource is the
# ap-southeast-1 probe node; it still runs the live prober until the replacement
# prober is provisioned on the main host.

app_dir: /opt/llmstatus
data_dir: /data

# Ingest endpoint — probe nodes push results here (through nginx)
ingest_url: "https://llmstatus.io/ingest/v1/probe"

# Main server public IP — used by probe nodes to connect to Postgres
main_server_ip: "15.235.186.156"

# Probe node IPs — used to open Postgres port 15432 on the main server
probe_node_ips:
  - 13.215.198.220   # ap-southeast-1 (AWS)

# Go binary version tag to deploy
app_version: main

# Region ID for the main server probe node (Singapore host)
main_region_id: ap-southeast-1
